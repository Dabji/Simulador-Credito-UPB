# =============================================================================
# CAPA 2: DevSecOps — Dependabot (Gestión de Dependencias Optimizada)
# =============================================================================
# Revisa mensualmente las dependencias del monorepo y las agrupa en un único PR
# para evitar saturar la pestaña de Pull Requests en el repositorio público.
# =============================================================================

version: 2

updates:
  # ─── npm (Monorepo raíz — mensual y agrupado) ───
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "08:00"
      timezone: America/Bogota
    open-pull-requests-limit: 1 # Máximo un PR agrupado abierto a la vez
    groups:
      production-dependencies:
        patterns:
          - "*" # Agrupa TODOS los paquetes de npm en un solo Pull Request
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(npm):"
    reviewers:
      - "Dabji"

  # ─── GitHub Actions (Mensual y agrupado) ───
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "08:00"
      timezone: America/Bogota
    open-pull-requests-limit: 1
    groups:
      actions-dependencies:
        patterns:
          - "*" # Agrupa todas las actualizaciones de Actions en un solo PR
    labels:
      - "dependencies"
      - "ci/cd"
    commit-message:
      prefix: "deps(actions):"
