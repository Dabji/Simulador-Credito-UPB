name: "Deploy to Production (Red Hat)"

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: "Desplegar a Produccion"
    runs-on: self-hosted
    environment: production

    steps:
      - name: Descargar ultimo codigo
        uses: actions/checkout@v6

      - name: Validar configuracion requerida
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          PORT: ${{ vars.PORT }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_SSL: ${{ vars.DB_SSL }}
          LDAP_URL: ${{ vars.LDAP_URL }}
          LDAP_DOMAIN: ${{ vars.LDAP_DOMAIN }}
          LDAP_BASE_DN: ${{ vars.LDAP_BASE_DN }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DB_CA_CERT: ${{ secrets.DB_CA_CERT }}
        run: |
          required_vars=(
            VITE_API_URL
            PORT
            FRONTEND_URL
            DB_HOST
            DB_PORT
            DB_NAME
            DB_USER
            DB_SSL
            LDAP_URL
            LDAP_DOMAIN
            LDAP_BASE_DN
            JWT_EXPIRES_IN
            SMTP_HOST
            SMTP_PORT
            SMTP_USER
            SMTP_FROM_EMAIL
          )

          required_secrets=(
            DB_PASSWORD
            JWT_SECRET
            SMTP_PASS
            DB_CA_CERT
          )

          missing=()

          for name in "${required_vars[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("vars.${name}")
            fi
          done

          for name in "${required_secrets[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("secrets.${name}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Faltan variables/secrets requeridos para produccion:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

          if [ "$DB_SSL" != "true" ]; then
            echo "vars.DB_SSL debe ser true en produccion."
            exit 1
          fi

          if echo "$FRONTEND_URL" | grep -qi 'localhost'; then
            echo "vars.FRONTEND_URL no debe apuntar a localhost en produccion."
            exit 1
          fi

          if echo "$VITE_API_URL" | grep -qi 'localhost'; then
            echo "vars.VITE_API_URL no debe apuntar a localhost en produccion."
            exit 1
          fi

      - name: Instalar certificado CA de Aiven
        env:
          DB_CA_CERT: ${{ secrets.DB_CA_CERT }}
        run: |
          mkdir -p server/certs
          printf '%s\n' "$DB_CA_CERT" > server/certs/ca.pem
          chmod 600 server/certs/ca.pem

      - name: Instalar dependencias del monorepo
        run: npm ci

      - name: Construir frontend y backend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm run build --workspace=client
          npm run build --workspace=server

      - name: Desplegar frontend en Nginx
        run: |
          rm -rf /usr/share/nginx/html/*
          cp -r client/dist/* /usr/share/nginx/html/

      - name: Reiniciar backend con PM2
        env:
          NODE_ENV: production
          PORT: ${{ vars.PORT }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: ${{ vars.DB_SSL }}
          LDAP_URL: ${{ vars.LDAP_URL }}
          LDAP_DOMAIN: ${{ vars.LDAP_DOMAIN }}
          LDAP_BASE_DN: ${{ vars.LDAP_BASE_DN }}
          LDAP_TIMEOUT_MS: ${{ vars.LDAP_TIMEOUT_MS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS }}
          PURGE_INTERVAL_HOURS: ${{ vars.PURGE_INTERVAL_HOURS }}
          PURGE_BATCH_SIZE: ${{ vars.PURGE_BATCH_SIZE }}
          TOKEN_PURGE_RETENTION_DAYS: ${{ vars.TOKEN_PURGE_RETENTION_DAYS }}
          TOKEN_PURGE_INTERVAL_HOURS: ${{ vars.TOKEN_PURGE_INTERVAL_HOURS }}
          TOKEN_PURGE_BATCH_SIZE: ${{ vars.TOKEN_PURGE_BATCH_SIZE }}
        run: |
          cd server
          pm2 reload ecosystem.config.js --env production --update-env \
            || pm2 start ecosystem.config.js --env production --update-env
          pm2 save

      - name: Health check
        run: |
          sleep 15
          curl --fail --silent --max-time 10 http://localhost:3000/api/health \
            || { echo "Health check fallo. Revisar logs con: pm2 logs simulador-backend"; exit 1; }
