# =============================================================================
# CAPA 2: DevSecOps — CodeQL (Análisis Estático de Seguridad / SAST)
# =============================================================================
# Escanea el código JavaScript/TypeScript en cada push a main y en PRs.
# Detecta vulnerabilidades como inyección SQL, XSS, dependencias inseguras,
# y otros patrones peligrosos definidos en el OWASP Top 10.
# =============================================================================

name: "🔒 CodeQL Security Analysis"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Escaneo semanal adicional (lunes 6:00 AM UTC-5 Bogotá)
    - cron: "0 11 * * 1"

# Cancela ejecuciones duplicadas en PRs
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: "🛡️ Análisis de Seguridad"
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v6

      - name: 🔧 Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Queries extendidas: incluyen detección de calidad + seguridad
          queries: security-extended

      - name: 🏗️ Auto-build
        uses: github/codeql-action/autobuild@v4

      - name: 🔍 Ejecutar análisis CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
